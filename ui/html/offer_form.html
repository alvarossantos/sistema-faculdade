<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill me-2"></i>UniSystem</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="students.html">Alunos</a></li>
                    <li class="nav-item"><a class="nav-link" href="teachers.html">Professores</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="disciplines.html">Disciplinas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="offers.html">Turmas</a></li>
                    <li class="nav-item"><a class="nav-link" href="semesters.html">Semestres</a></li>
                    <li class="nav-item"><a class="nav-link" href="departments.html">Departamentos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container fade-in">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card main-card">
                    <div class="card-header">
                        <h4 class="m-0">Nova Oferta de Disciplina</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="offerForm">
                            
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Semestre</label>
                                    <select class="form-select" id="semester_id" required>
                                        <option value="" disabled selected>Carregando...</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Cód. Turma</label>
                                    <input type="text" class="form-control" id="class_code" placeholder="Ex: T01" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Horário</label>
                                    <input type="text" class="form-control" id="schedule" placeholder="Ex: Seg 19:00" required>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label">Disciplina</label>
                                    <select class="form-select" id="discipline_id" required>
                                        <option value="" disabled selected>Carregando...</option>
                                    </select>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label">Professor Responsável</label>
                                    <select class="form-select" id="teacher_id" required>
                                        <option value="" disabled selected>Carregando...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="offers.html" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">Salvar Oferta</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/offers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initForm);
    </script>
</body>
</html>
